<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取り合わせ｜KEICHIKU TARUMI Gallery Shop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@200;300;400;500&display=swap" rel="stylesheet">

    <style> 
        img{
            width:100%;
            aspect-ratio:3/4;
            object-fit:cover;
            display:block;
            margin-bottom:8px;            
        }

        main{
            max-width:1200px;
            margin:0 auto;
            padding:24px;

        }

        header{
            text-align:center;
            padding:2px 0 6px;
            border-bottom:1px solid var(--border-color);
        }

        header img{
            width:auto;
            max-height:60px;
            aspect-ratio:1/1;
            object-fit:contain;
        }

        footer{
            text-align:center;
            padding:40px 24px;
            margin-top:64px;
            border-top: 1px solid var(--border-color);
        }

        footer img{
            text-align: center;
            width:auto;
            max-height:180px;
            aspect-ratio:1/1;
            object-fit:contain;
            margin: auto;
        }

        footer a{
            font-size:18px;
            letter-spacing:0.05em;
            color:var(--text-color);
            text-decoration:none;
            margin-top:16px;
        }

        footer p{
            font-size: 18px;
            margin: 16px;
            font-weight:300;
        }
        :root{
            --font-base:'Noto Serif JP',serif;
            --text-color:#000;
            --bg-color:#E4E8E7;
            --border-color:#000;
        }
        
        body{
            font-size:24px;
            font-family:var(--font-base);
            line-height:1.8;
            font-weight:300;
            color:var(--text-color);
            background:var(--bg-color);
            max-width:1200px;
            margin:0 auto;
            padding:17px;
        }

        h1{
            font-size:26px;
            font-weight:300;
        }

        h2{
            font-size:18px;
            font-weight:300;
        }

        p{
            font-size:18px;

        }

        #vases-list,
        #lifestyle-list,
        #bonsai-list{

            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
            gap:24px;        
            min-height:800px;        
        }

        #vases-list > div,
        #lifestyle-list > div,
        #bonsai-list > div{
            width:100%;
            margin:0 auto;

            font-size:20px;
            line-height:1.8;
            font-weight:300;
        }

        #vases-list div > img,
        #lifestyle-list div > img,
        #bonsai-list div > img{
            width:100%;
            margin:0 auto 8px;   
            
        }
        
        
        .empty-message{
            grid-column:1/-1; 
            text-align:center;
            width:100%;
        }
        .product-title{
            min-height:3.6em;
            margin:0 0 8px;
        }
        .selected{
            position:relative;
            outline:none;
        }  

        .selected img{
            opacity:0.55;
            transition:opacity 0.3s ease;
        }

        .selected:after{
            content:"選択中";
            position:absolute;
            top:12px;
            right:12px;
            padding:4px 8px;
            font-size:10px;
            background:rgba(255,255,255,0.85);
            border:0.5px solid var(--border-color);

        }

        #category-tabs{
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:12px;
            margin:24px 0;
        }

        #category-tabs button{
            font-family:var(--font-base);
            font-size:18px;
            font-weight:200;
            color:var(--text-color);
            background:transparent;
            border:1px solid var(--border-color);
            padding:14px 8px;
            cursor:pointer;
        }

        #category-tabs button.active{
            background: #d1d7d0;
            color:#000;
        }

        .hidden{
            display:none;
        }

        #result{
            display:grid;
            grid-template-columns:repeat(3,minmax(0,1fr));
            gap:24px;
        }    

        .result-card{
            border:1px solid var(--border-color);
            padding:16px;
            min-height:160px;
            box-sizing:border-box;
            font-size:25px;
            line-height:1.8;
            background:#ececec;
        }

        .result-card p{
            margin :0 0 12px;
            font-size:18px;

        }

        .result-card img{
            margin-bottom:12px;
            width:70%;
            height:auto;
        }

        #total-price{
            font-weight:200;
        }

        #cart-button{
                display:block;
                width:100%;
                max-width:400px;
                margin:24px auto 0;
                padding:14px 16px;
                font-family:var(--font-base);
                font-size:14px;
                font-weight:200;
                letter-spacing:0.05em;
                color:var(--text-color);
                background:transparent;
                border:1px solid var(--border-color);

                cursor:pointer;
                transition:background 0.3s ease;;
            }

            #cart-button:hover{
                background: #d1d7d0;
   
            }

        

        @media (max-width:768px){
            header{
                padding:2px 0 4px;
                position:sticky;
                top:0;
                z-index:1000;
                background:var(--bg-color);
            }

            header img{
                width:auto;
                max-height:40px;
                aspect-ratio:1/1;
                object-fit:contain;
                margin: 5px auto; 
            }

            footer img{
            text-align: center;
            width:auto;
            max-height:120px;
            aspect-ratio:1/1;
            object-fit:contain;
            margin: auto;
        }

            footer a{
            font-size:14px;
            letter-spacing:0.05em;
            color:var(--text-color);
            text-decoration:none;
            margin-top:16px;
        }


            footer p{
                font-size: 14px;
                margin: 16px;
            }

            
            
            body{
                font-size:18px;
                font-family:var(--font-base);
                line-height:1.8;
                font-weight:300;
                color:var(--text-color);
                background:var(--bg-color);
                max-width:1200px;
                margin:0 auto;
                padding:17px;
            }

            h1{
                font-size:20px;
                
            }

            h2{
                font-size:14px;
            }
        
            #vases-list,
            #lifestyle-list,
            #bonsai-list{
                display:flex;
                overflow-x:auto;
                gap:12px;
                min-height:260px;
                padding-bottom:10px;
                }

            #vases-list > div,
            #lifestyle-list > div,
            #bonsai-list > div {
                flex:0 0 160px;
                font-size:16px;
                line-height:1.8;
            }  

            #vases-list > div  >p:last-child,
            #lifestyle-list > div >p:last-child,
            #bonsai-list > div >p:last-child {
                font-size:14px;
                white-space:nowrap;
            }  
            #category-tabs{
                    grid-template-columns: 1fr;
                    gap:8px;
                }

            #category-tabs button{
                    padding:12px 8px;
                    font-size:16px;
                }
                
            #result{
                    grid-template-columns: 1fr;
                    gap:12px;
                    justify-items:center;
                }

            .result-card{
                width:60%;
                padding:10px;
                max-width:200px;
                min-height:60px;
                box-sizing:border-box;
                font-size:14px;
            
            }

            .result-card img{
                width:100%;
                height:auto;
                max-height:240px;
                object-fit:contain;
                margin:auto;
            }

            .result-card p{
                margin :0 0 12px;
                font-size:14px;
            }
            
            .product-title{
                min-height:5.4em;
               
            }
            
            #total-price{
                font-size:16px;
            }

            #cart-button{
                max-width:320px;
                padding:12px 16px;
                font-size:12px;
            }

        
        }

            


    </style>
</head>
             
<body>

    <header>
        <a href="https://keichiku-gallery.com/">
            <img src="https://keichiku-gallery.com/cdn/shop/files/9-Photoroom_152x.png?v=1769931843" alt="KEICHIKU TARUMI Gallery Shop">
        </a>
    </header>

    <main>
        <h1>お取り合わせ</h1>

        <p>器・暮らしのアイテム・草木の組み合わせをお試しいただけます。</p>

    <div id="category-tabs">
        <button id="vases-tab" class="active" type="button">
            花器・一輪挿し
        </button>

        <button id="lifestyle-tab" type="button">
            暮らしのアイテム
        </button>

        <button id="bonsai-tab" type="button">
            盆栽・蘭・山野草
        </button>
    </div>

    
        
    <section id="vases-section">
        <h2>花器・一輪挿しを選ぶ</h2>
        <div id="vases-list">読み込み中</div>
    </section>  
    
    <section id="lifestyle-section" class="hidden">
        <h2>暮らしのアイテムを選ぶ</h2>
        <div id="lifestyle-list">読み込み中</div>
    </section>    

    <section id="bonsai-section" class="hidden">
        <h2>盆栽・蘭・山野草を選ぶ</h2>
        <div id="bonsai-list">読み込み中</div>
    </section>

        <h2>選択した取り合わせ</h2>
        <div id="result">選択されていません</div>

        <p id="total-price">合計金額: 0 円</p>
     
    <button id="cart-button" type="button">選択した商品をカートに追加</button>  
    </main>

    <footer>
        <img src="https://keichiku-gallery.com/cdn/shop/files/sologo-aitools-bgremover_2_520x.png?v=1769957476" alt="KEICHIKU TARUMI Gallery Shop">
        <a href="https://keichiku-gallery.com/">オンラインショップへ戻る</a>
        <p>KEICHIKU TARUMI Gallery Shop</p>
    </footer>

const vasesTab=document.getElementById("vases-tab");
const lifestyleTab=document.getElementById("lifestyle-tab");
const bonsaiTab=document.getElementById("bonsai-tab");

const vasesSection=document.getElementById("vases-section");
const lifestyleSection=document.getElementById("lifestyle-section");
const bonsaiSection=document.getElementById("bonsai-section");

vasesTab.addEventListener("click",()=>{
    vasesSection.classList.remove("hidden");
    lifestyleSection.classList.add("hidden");
    bonsaiSection.classList.add("hidden");

    vasesTab.classList.add("active");
    lifestyleTab.classList.remove("active");
    bonsaiTab.classList.remove("active");

});

lifestyleTab.addEventListener("click",()=>{
    vasesSection.classList.add("hidden");
    lifestyleSection.classList.remove("hidden");
    bonsaiSection.classList.add("hidden");

    vasesTab.classList.remove("active");
    lifestyleTab.classList.add("active");
    bonsaiTab.classList.remove("active");
});

bonsaiTab.addEventListener("click",()=>{
    vasesSection.classList.add("hidden");
    lifestyleSection.classList.add("hidden");
    bonsaiSection.classList.remove("hidden");

    vasesTab.classList.remove("active");
    lifestyleTab.classList.remove("active");
    bonsaiTab.classList.add("active");
});


let selectedVaseItem=null; //HTML要素
let selectedVaseData=null; //商品データ

const vasesItems=document.querySelectorAll("#vases-list div");
vasesItems.forEach((item,index)=>{
    item.addEventListener("click",()=>{
        if(selectedVaseItem){
            selectedVaseItem.classList.remove("selected");
        }
        item.classList.add("selected");
        selectedVaseItem=item;
        selectedVaseData=vasesEdges[index].node;
        console.log(selectedVaseData.title);
        console.log(selectedVaseData.variants.edges[0].node.id);
        const vaseVariantId=selectedVaseData.variants.edges[0].node.id.split("/").pop();

        console.log(vaseVariantId);
        showResult();
    });
});

let selectedLifestyleItem=null; //HTML要素
let selectedLifestyleData=null; //商品データ

const lifestyleItems=document.querySelectorAll("#lifestyle-list div");
lifestyleItems.forEach((item,index)=>{
    item.addEventListener("click",()=>{
        if(selectedLifestyleItem){
            selectedLifestyleItem.classList.remove("selected");
        }
        item.classList.add("selected");
        selectedLifestyleItem=item;
        selectedLifestyleData=lifestyleEdges[index].node;

let selectedBonsaiItem=null; //HTML要素

        selectedBonsaiItem=item;

function showResult(){
    const items=[
        {
            label:"花器・一輪挿し",
            data:selectedVaseData
        },

        {
            label:"暮らしのアイテム",
            data:selectedLifestyleData
        },

        {
            label:"盆栽・蘭・山野草",
            data:selectedBonsaiData
        }    
        ];

        const html=items.map((item)=>{
            if(item.data===null){
                return`
                    <div class="result-card">
                        <p>${item.label}</p>
                        <p>未選択</p>
                        </div>
                `;

            }
            return`
                <div class="result-card">
                    <p>${item.label}</p>
                    <img src="${item.data.featuredImage.url}">
                    <p>${item.data.title}</p>
                    ${
                        item.data.availableForSale
                    ?
                        `<p>${Number(item.data.priceRange.minVariantPrice.amount).toLocaleString()}円 </p>`
                    :
                        `<p>売り切れ</p>`
                    }
                
                </div>
            `;    
        }).join("");

        document.getElementById("result").innerHTML=html;

        let totalPrice=0;
        if(selectedVaseData && selectedVaseData.availableForSale){
            totalPrice+=Number(selectedVaseData.priceRange.minVariantPrice.amount);
        }
        if(selectedLifestyleData && selectedLifestyleData.availableForSale){
            totalPrice+=Number(selectedLifestyleData.priceRange.minVariantPrice.amount);
        }
        if(selectedBonsaiData && selectedBonsaiData.availableForSale){
            totalPrice+=Number(selectedBonsaiData.priceRange.minVariantPrice.amount);
        }
        document.getElementById("total-price").textContent=`合計金額: ${totalPrice.toLocaleString()} 円`;
    }
    showResult();

    const cartButton=document.getElementById("cart-button");
    cartButton.addEventListener("click",()=>{
        const selectionItems=[
            selectedVaseData,
            selectedLifestyleData,
            selectedBonsaiData
        ].filter((item)=>item!==null);

        if (selectionItems.length===0){
            alert("商品を選択してください");
            return;
    }

        const cartItems=selectionItems.map((item)=>{
            const variantId=item.variants.edges[0].node.id.split("/").pop();
            return `${variantId}:1`;
        }).join(",");

        const cartUrl=`https://keichiku-gallery.com/cart/${cartItems}?storefront=true`;
        window.location.href=cartUrl;
    });

const savedScrollPosition=
        sessionStorage.getItem("scrollPosition");    
    if(savedScrollPosition !== null){
        window.scrollTo(0,Number(savedScrollPosition));
}
