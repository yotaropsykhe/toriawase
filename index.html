<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>取り合わせ｜KEICHIKU TARUMI Gallery Shop</title>

    <style> 
        img{
            width:100%;
            aspect-ratio:3/4;
            object-fit:cover;
            display:block;
            margin-bottom:8px;            
        }

        main{
            max-width:1200px;
            margin:0 auto;
            padding:24px;

        }

        header{
            text-align:center;
            padding:24px;
            border-bottom:1px solid var(--border-color);
        }

         header img{
            width:auto;
            max-height:60px;
            aspect-ratio:1/1;
            object-fit:contain;
        }

        footer{
            text-align:center;
            padding:40px 24px;
            margin-top:64px;
            border-top: 1px solid var(--border-color);
        }

         footer img{
            text-align: center;
            width:auto;
            max-height:150px;
            aspect-ratio:1/1;
            object-fit:contain;
            margin: auto;
        }

        footer a{
            font-size:17px;
            letter-spacing:0.05em;
            color:var(--text-color);
            text-decoration:none;
        }

        footer p{
            font-size: 16px;
            margin-top: 16px;
        }
        :root{
            --font-base:'Noto Serif JP',serif;
            --text-color:#000;
            --bg-color:#E4E8E7;
            --border-color:#000;
        }
        
        body{
            font-family:var(--font-base);
            line-height:18px;
            font-weight:400;
            color:var(--text-color);
            background:var(--bg-color);
            max-width:1200px;
            margin:0 auto;
            padding:17px;
        }

        h1{
            font-size:24px;
            font-weight:400;
        }

        h2{
            font-size:18px;
            font-weight:400;
        }

        #vases-list,
        #plates-list,
        #bonsai-list{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
            gap:24px;                
        }

        #vases-list div,
         #plates-list div,
         #bonsai-list div {
            font-size:13px;
               line-height:1.8;
        }
        .selected{
            outline:1px solid var(--border-color);
            outline-offset:8px;
        }  

        #category-tabs{
            display:grid;
            grid-template-columns: repeat(3,1fr);
            gap:12px;
            margin:24px 0;
        }

        #category-tabs button{
            font-family:var(--font-base);
            font-size:18px;
            font-weight:400;
            color:var(--text-color);
            background:transparent;
            border:1px solid var(--border-color);
            padding:14px 8px;
            cursor:pointer;
        }

        #category-tabs button.active{
            background: #d1d7d0;
            color:#000;
        }

        .hidden{
            display:none;
        }

        #result{
            display:grid;
            grid-template-columns:repeat(3,minmax(0,1fr));
            gap:24px;
        }    

        .result-card{
            border:1px solid var(--border-color);
            padding:16px;
            min-height:160px;
            box-sizing:border-box;
            font-size:14px;
            line-height:1.8;
            background:#ececec;
        }

        .result-card p{
            margin :0 0 12px;
            font-size:14px;
        }

        .result-card img{
            margin-bottom:12px;
        }

        @media (max-width:768px){
            #vases-list,
            #plates-list,
            #bonsai-list{
                grid-template-columns: 1fr 1fr;
            }

            #category-tabs{
                grid-template-columns: 1fr;
                gap:8px;
            }

            #category-tabs button{
                padding:12px 8px;
                font-size:12px;
            }
            
            #result{
                grid-template-columns: 1fr;
                gap:12px;
            }
        }
            


    </style>
</head>
             
<body>

    <header>
        <a href="https://keichiku-gallery.com/">
            <img src="https://keichiku-gallery.com/cdn/shop/files/9-Photoroom_152x.png?v=1769931843" alt="KEICHIKU TARUMI Gallery Shop">
        </a>
    </header>

    <main>
        <h1>取り合わせ</h1>

        <p>器・敷板・草木の組み合わせをお試しいただけます。</p>

    <div id="category-tabs">
        <button id="vases-tab" class="active" type="button">
            花器・一輪挿し
        </button>

        <button id="plates-tab" type="button">
            敷板
        </button>

        <button id="bonsai-tab" type="button">
            盆栽・蘭・山野草
        </button>
    </div>

    
        
    <section id="vases-section">
        <h2>花器・一輪挿しを選ぶ</h2>
        <div id="vases-list">読み込み中</div>
    </section>  
    
    <section id="plates-section" class="hidden">
        <h2>敷板を選ぶ</h2>
        <div id="plates-list">読み込み中</div>
    </section>    

    <section id="bonsai-section" class="hidden">
        <h2>盆栽・蘭・山野草を選ぶ</h2>
        <div id="bonsai-list">読み込み中</div>
    </section>

        <h2>選択した取り合わせ</h2>
        <div id="result">選択されていません</div>
    </main>

    <footer>
        <img src="https://keichiku-gallery.com/cdn/shop/files/sologo-aitools-bgremover_2_520x.png?v=1769957476" alt="KEICHIKU TARUMI Gallery Shop">
        <a href="https://keichiku-gallery.com/">オンラインショップへ戻る</a>
        <p>KEICHIKU TARUMI Gallery Shop</p>
    </footer>



    <script type="module">
    const TOKEN="06f85e997eefa31a8f8ac722bc00b634";
    const query=`
{
    vases:collection(handle:"hanaire-ichirinzasi"){
          title
          products(first:20){
            edges{
                node{   
                    title
                    handle
                featuredImage{url(transform: {maxWidth:400})}
                    priceRange{minVariantPrice{amount}}
                }
            }
        }  
    }   
    plates:collection(handle:"shikiita-keikaboku-all"){
          title
          products(first:20){
            edges{
                node{
                    title
                    handle
                    featuredImage{url(transform: {maxWidth:400})}
                    priceRange{minVariantPrice{amount}}
                }
            }
        }  
    } 
    bonsai:collection(handle:"bonsai-ran-sanyasou"){
          title
          products(first:20){
            edges{
                node{
                    title
                    handle
                    featuredImage{url(transform: {maxWidth:400})}
                    priceRange{minVariantPrice{amount}}
                }
            }
        }  
    }
} 

`; 

//JavaScript
window.addEventListener("beforeunload", ()=>{
    sessionStorage.setItem("scrollPosition", window.scrollY);
});

const res = await fetch("https://keichiku-gallery.com/api/2026-07/graphql.json",{
    method:"POST",
    headers:{
            "Content-Type":"application/json",
            "X-Shopify-Storefront-Access-Token":TOKEN
},
    body:JSON.stringify({query})    
});


const data = await res.json();
console.log(data);
const vasesEdges=data.data.vases.products.edges;
const vasesTitles=vasesEdges.map((e)=>`<div> 
    <img src="${e.node.featuredImage.url}"> ${e.node.title}
    <p>${Number(e.node.priceRange.minVariantPrice.amount).toLocaleString()}円 </p>
    </div>
    `);


document.getElementById("vases-list").innerHTML=vasesTitles.join("");


const platesEdges=data.data.plates.products.edges;
const platesTitles=platesEdges.map((e)=>`<div> 
    <img src="${e.node.featuredImage.url}"> ${e.node.title}
    <p>${Number(e.node.priceRange.minVariantPrice.amount).toLocaleString()}円 </p>
    </div>
    `);
document.getElementById("plates-list").innerHTML=platesTitles.join("");

const bonsaiEdges=data.data.bonsai.products.edges;
const bonsaiTitles=bonsaiEdges.map((e)=>`<div> <img src="${e.node.featuredImage.url}"> ${e.node.title}</div>`);
document.getElementById("bonsai-list").innerHTML=bonsaiTitles.join("");


const vasesTab=document.getElementById("vases-tab");
const platesTab=document.getElementById("plates-tab");
const bonsaiTab=document.getElementById("bonsai-tab");

const vasesSection=document.getElementById("vases-section");
const platesSection=document.getElementById("plates-section");
const bonsaiSection=document.getElementById("bonsai-section");

vasesTab.addEventListener("click",()=>{
    vasesSection.classList.remove("hidden");
    platesSection.classList.add("hidden");
    bonsaiSection.classList.add("hidden");

    vasesTab.classList.add("active");
    platesTab.classList.remove("active");
    bonsaiTab.classList.remove("active");

});

platesTab.addEventListener("click",()=>{
    vasesSection.classList.add("hidden");
    platesSection.classList.remove("hidden");
    bonsaiSection.classList.add("hidden");

    vasesTab.classList.remove("active");
    platesTab.classList.add("active");
    bonsaiTab.classList.remove("active");
});

bonsaiTab.addEventListener("click",()=>{
    vasesSection.classList.add("hidden");
    platesSection.classList.add("hidden");
    bonsaiSection.classList.remove("hidden");

    vasesTab.classList.remove("active");
    platesTab.classList.remove("active");
    bonsaiTab.classList.add("active");
});


let selectedVaseItem=null; //HTML要素
let selectedVaseData=null; //商品データ

const vasesItems=document.querySelectorAll("#vases-list div");
vasesItems.forEach((item,index)=>{
    item.addEventListener("click",()=>{
        if(selectedVaseItem){
            selectedVaseItem.classList.remove("selected");
        }
        item.classList.add("selected");
        selectedVaseItem=item;
        selectedVaseData=vasesEdges[index].node;
        console.log(selectedVaseData.title);
        showResult();
    });
});

let selectedPlateItem=null; //HTML要素
let selectedPlateData=null; //商品データ

const platesItems=document.querySelectorAll("#plates-list div");
platesItems.forEach((item,index)=>{
    item.addEventListener("click",()=>{
        if(selectedPlateItem){
            selectedPlateItem.classList.remove("selected");
        }
        item.classList.add("selected");
        selectedPlateItem=item;
        selectedPlateData=platesEdges[index].node;
        console.log(selectedPlateData.title);
        showResult();
    });
});

let selectedBonsaiItem=null; //HTML要素
let selectedBonsaiData=null; //商品データ

const bonsaiItems=document.querySelectorAll("#bonsai-list div");
bonsaiItems.forEach((item,index)=>{
    item.addEventListener("click",()=>{
        if(selectedBonsaiItem){
            selectedBonsaiItem.classList.remove("selected");
        }
        item.classList.add("selected");
        selectedBonsaiItem=item;
        selectedBonsaiData=bonsaiEdges[index].node;
        console.log(selectedBonsaiData.title);
        showResult();
    });
});
function showResult(){
    const items=[
        {
            label:"花器・一輪挿し",
            data:selectedVaseData
        },

        {
            label:"敷板",
            data:selectedPlateData
        },

        {
            label:"盆栽・蘭・山野草",
            data:selectedBonsaiData
        }    
        ];

        const html=items.map((item)=>{
            if(item.data===null){
                return`
                    <div class="result-card">
                        <p>${item.label}</p>
                        <p>未選択</p>
                        </div>
                `;

            }
            return`
                <div class="result-card">
                    <p>${item.label}</p>
                    <img src="${item.data.featuredImage.url}">
                    <p>${item.data.title}</p>
                    <p>${Number(item.data.priceRange.minVariantPrice.amount).toLocaleString()}円 </p>

                
                </div>
            `;    
        }).join("");

        document.getElementById("result").innerHTML=html;
    }
    showResult();

const savedScrollPosition=
    sessionStorage.getItem("scrollPosition");    
if(savedScrollPosition !== null){
    window.scrollTo(0,Number(savedScrollPosition));
}


    </script>
</body>
</html>
